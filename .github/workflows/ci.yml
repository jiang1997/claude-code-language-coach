name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Validate the mod and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .
      - name: Run native Mods tests
        run: npx --yes @anthropic-ai/claude-code@2.1.295 plugin test .
